configuration = [
  "Board DTS carries the contiguous DRAM range; ADT memory-map placeholders come from the generator.",
  "UniXNU FD placement fixed: FD_BASE=0x92000000, FD_SIZE=0x300000, in the free window 0x916c4478-0xb1c00000 (about 508 MB) above the aboot image and below cont_splash_mem_hdmi; recorded as unixnu_fd_region in dts/g0245d.dts.",
  "Dynamic pools pinned at 0x178c00000-0x180000000 (116 MB from the top of 4 GB) so the layout matches the stock kernel carve.",
