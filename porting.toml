inputs = [
  "UFS 2.0 controller ufshc@624000, PHY ufsphy@627000, SPI 265; 64 GB part; stock GPT from the QFIL rawprogram XML (4096 B sectors, multi-LUN).",
  "Partition geometry from rawprogram_unsparse*.xml (scripts/extract-files.py): userdata LBA 74312..14526452 (55.13 GiB), system 56074..842457 (3.00 GiB), boot 39690..56073 (64 MiB), persist 8..1180, cache 8200..40986; board.toml now carries the real userdata window.",
