schema_version = 1

[device]
name = "g0245d"
soc = "msm8996"
os_profile = "ios-16.5-20F66"
summary = "Gree G0245D (格力手机·色界) iOS 16.5 (20F66) XNU bring-up on MSM8996. The LK/aboot BootShim contract is reverse-engineered and the stage-1 boot image builds and flashes end-to-end. v366 on-device photos prove the updated kernel executes and passes pmap/TLBI switching, then hits an EL1 data abort; v367 with ESR/FAR/PC/register diagnostics has been flashed and is awaiting fresh device evidence. The v304 boot-layer blocker is historical, not current."

