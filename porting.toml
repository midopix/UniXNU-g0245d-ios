findings = [
  "v366 photos (2026-11-25): after flash, trace ring showed v356 post and repeated v357 s9, followed by v329 panic msg / Kernel data abort / v328 ec 37; heartbeat advanced. This proves the newer kernel executed and passed the prior pmap/TLBI switch blocker before hitting a new EL1 DABORT. v367 (boot MD5 6b21b112fb20d35a56fc7a5f43479971) was flashed successfully on 2026-11-25, but fresh post-boot display evidence is pending.",
  "The applied XNU osfmk/arm/machine_routines_apple.c defines configure_timer_apple_regs(), configure_misc_apple_boot_args() and configure_misc_apple_regs() as empty functions. An Apple-specific register trap is not established; wfe_timeout_configure() and wfe_timeout_init() in osfmk/arm64/machine_routines.c remain active candidates.",
  "The v212 diagnostic-only patch is applied and its kernel finished compiling on 2026-11-20 (kernel.macho sha256 870dd404469d7a643d6d686edd78dffaf42a227f1817e8ec58cb650962c404ee); the payload was rebuilt (24 MiB) and verified to contain that kernel. No boot image was packed: linux/ios-pipeline.py aborted at its staged-kernel readback (FileNotFoundError on payload/stage/EFI/UniXNU/Payloads/kernel.macho), so v212 has not been flashed. Its sequential checkpoints are 1660 before configure_timer_apple_regs(), 1680 after it, 1700 after wfe_timeout_configure(), 1720 after wfe_timeout_init(), 1740 after configure_misc_apple_boot_args(), and 1760 after configure_misc_apple_regs(). These execute between existing raw 1500 and raw 1520; raw 1480 remains the later arm_vm_init() entry boundary. No v212 boot or fault location is verified yet.",
  "v298-v306 (2026-11-23): on-device framebuffer trace probes followed the XNU VFS root-mount chain: v298 reached VFS_ROOT, v300 entered namei, v301 froze in lookup_consider_update_cache (name cache), v302 bypassed the name cache and reached mount_common, v303 passed mount_common (mount_zone Z_WAITOK), and v304 entered devfs_mount (dm kalloc ok) before the DEVFS_LOCK region.",
  "Historical screen-era detail: the v298-v306 ring once appeared to continue v304; that observation was later superseded by the 2026-11-25 v366 photos, which prove a newer kernel executed. The trace_seq value itself restarts on a real reboot, while a static screen can retain a prior value.",
  "Historical: v305/v306 boot images once appeared not to change the on-screen trace, and the boot-layer blocker was inferred from that limited evidence. v366 photos later proved newer kernels execute, so this old inference is void; the current blocker is the post-switch EL1 DABORT.",
]
